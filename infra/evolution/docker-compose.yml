name: frota-evolution
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: frota-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"            # REGRA DE OURO: só a própria máquina acessa
    env_file: ./.env.evolution
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instancias:/evolution/instances
    mem_limit: 2500m
    cpus: 1.0
    networks: [frota_evo]
networks:
  frota_evo:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  evolution_instancias:
